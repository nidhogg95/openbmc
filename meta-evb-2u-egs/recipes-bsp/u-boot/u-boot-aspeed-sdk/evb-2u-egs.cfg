# EVB-2U-EGS U-Boot configuration fragment
# Extend vmalloc to 512MB for SPI FMC AHB window mapping on 2GB DRAM systems.
# The AST2600 SPI driver needs ~256MB contiguous vmalloc for the FMC AHB window.
# Default vmalloc (240MB) is insufficient → kernel panic on boot.
# Facebook uses 768M; 512M is sufficient for our dual-flash 128MB total.
CONFIG_USE_BOOTARGS=y
CONFIG_BOOTARGS="console=ttyS4,115200n8 root=/dev/ram rw vmalloc=512M"
