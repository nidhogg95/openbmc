# EVB-2U-EGS kernel configuration fragment
# Platform: AST2600, Intel EGS 2U rack server

# Memory split: 3G user / 1G kernel (3G_OPT variant)
# Required for 2GB DRAM + 256MB FMC AHB window mapping in vmalloc space.
# Without this, SPI driver fails with "vmalloc_node_range ... failed" → Kernel Panic.
# Reference: meta-facebook platforms (ventura, harma, catalina) all use this.
CONFIG_VMSPLIT_3G_OPT=y

# Kernel built-in cmdline extension: always append vmalloc=512M
# U-Boot loads environment from SPI Flash which may have old bootargs without vmalloc=512M.
# CONFIG_CMDLINE_EXTEND appends to whatever U-Boot passes, ensuring vmalloc is always set.
# This is the reliable fix for real hardware where U-Boot env overrides CONFIG_BOOTARGS.
CONFIG_CMDLINE="vmalloc=512M"
CONFIG_CMDLINE_EXTEND=y

# Aspeed ADC (iio-hwmon, 16 channels: adc0 + adc1)
CONFIG_COMMON_CLK=y
CONFIG_ASPEED_ADC=y

# I2C MUX: PCA9546 (bus0, bus3) + PCA9548 (bus3 NVMe)
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_PCA954x=y

# EEPROM: AT24C64 (MB FRU bus2, MAC bus3)
CONFIG_EEPROM_AT24=y

# Temperature sensors: LM75 (bus3-mux, bus7, bus8, bus13)
CONFIG_SENSORS_LM75=y

# System board sensors: LM87 (bus7)
CONFIG_SENSORS_LM87=y

# ADT7475 fan controller / sensor (bus7, ADT7468-compatible)
CONFIG_SENSORS_ADT7475=y

# PSU PMBus (bus7: 0x58, 0x59)
CONFIG_PMBUS=y
CONFIG_SENSORS_PMBUS=y

# AD5593R analog I/O (bus3-mux CH0: 0x10, 0x11)
CONFIG_AD5593R=y

# PECI: CPU thermal (CPU0@0x30, CPU1@0x31)
CONFIG_PECI=y
CONFIG_PECI_ASPEED=y
CONFIG_SENSORS_PECI_CPUTEMP=y
CONFIG_SENSORS_PECI_DIMMTEMP=y

# IPMB device (bus5)
CONFIG_IPMB_DEVICE_INTERFACE=y

# IPMI / KCS
CONFIG_IPMI_HANDLER=y
CONFIG_IPMI_DEVICE_INTERFACE=y
CONFIG_ASPEED_KCS_IPMI_BMC=y

# LPC snoop (port 80h POST codes)
CONFIG_ASPEED_LPC_SNOOP=y

# NC-SI (mac2 BMC management NIC, shared via host NIC sideband)
CONFIG_NCSI_OEM_CMD_GET_MAC=y

# GPIO LEDs (front panel LEDs)
CONFIG_LEDS_GPIO=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y

# Device tree overlay support
CONFIG_OF=y
